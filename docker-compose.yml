services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: food_tracker
      POSTGRES_PASSWORD: food_tracker
      POSTGRES_DB: food_tracker
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U food_tracker']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://food_tracker:food_tracker@postgres:5432/food_tracker?schema=public
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me-32-characters-min}
      PORT: 4000
      ALLOW_REGISTRATION: 'true'
    ports:
      - '4000:4000'

  # frontend будет добавлен на следующем этапе (Next.js)

volumes:
  pgdata:
