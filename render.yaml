services:
  - type: web
    name: food-tracker-backend
    runtime: docker
    repo: # заполняется автоматически при подключении репозитория в дашборде Render
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false # вставить вручную в дашборде — строка подключения из Neon
      - key: JWT_SECRET
        generateValue: true # Render сам сгенерирует случайный секрет
      - key: ALLOW_REGISTRATION
        value: 'true' # после регистрации своего аккаунта переключить на 'false' и передеплоить
      - key: FRONTEND_URL
        sync: false # вставить вручную — URL фронтенда на Vercel, напр. https://food-tracker.vercel.app
